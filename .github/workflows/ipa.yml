# Unsigned device IPA, for sideloading (TrollStore / AltStore / Sideloadly) and for testing.
# The upstream workflow only compiles the simulator; this one archives for the device with
# signing disabled and packages Payload/ into an .ipa.
name: Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # macos-15 = Xcode 16: the iOS 26 continued-processing code is compiled out
    # (`#if DSH_IOS26_SDK`), which the 26-only runner used to provide.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      - name: Compile (device, unsigned)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            GOFLAGS= \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find app/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          rm -rf Payload FishPocket-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FishPocket-unsigned.ipa Payload
          ls -lh FishPocket-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: FishPocket-unsigned-ipa
          path: FishPocket-unsigned.ipa
          retention-days: 30
