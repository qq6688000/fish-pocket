# Compile the app for the iOS simulator on every PR into main, without signing or running it.
# The same steps as scripts/run-sim.sh up to `xcodebuild build`: fetch nodejs-mobile,
# build libgit2, assemble the engine tree, generate the project, compile.
# macOS minutes are dear on a private repo: the downloaded / built vendor/ is
# cached by the hash of the script that makes it, and docs-only changes skip.
name: iOS build

on:
  # 出包优先：模拟器构建只在手动点的时候跑，免得和 IPA 抢 macOS 机位。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # iOS 26 SDK (BGContinuedProcessingTask and friends): Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      # A path function new to Node would slip past native/root: stop here instead.
      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      # Only the installed slices and the xcframework; the source and build trees stay out.
      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      # The vendored xcframeworks are arm64 only; a generic destination would add x86_64.
      - name: Compile (iOS simulator)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build -quiet
