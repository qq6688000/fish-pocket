<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0C0C0D}a:hover{color:#0C0C0D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0C0C0D; font-family: Inter, 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 54px 8px 0 20px; display: flex; align-items: center">
    <h1 style="margin: 0; flex: 1; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">设置</h1>
    <a href="Drawer.dc.html" aria-label="关闭" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
  </header>

  <div style="margin: 20px 12px 0; background: #F5F5F6; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 12px">
    <span style="width: 8px; height: 8px; border-radius: 4px; background: #12A06A; box-shadow: 0 0 0 4px rgba(18,160,106,0.15)"></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 600">引擎运行中</span>
      <span style="font-size: 13px; color: #6B6B72">已运行 2 小时 · 内存 312 MB</span>
    </span>
    <button style="all: unset; height: 36px; padding: 0 14px; border-radius: 18px; background: #E5E5E8; font-size: 14px; font-weight: 600; cursor: pointer">重启</button>
  </div>

  <main style="flex: 1; padding: 0 12px; display: flex; flex-direction: column">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="font-size: 13px; color: #6B6B72; padding: 22px 12px 8px">{{g.title}}</div>
      <div style="background: #F5F5F6; border-radius: 22px; padding: 4px 0">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <a href="{{r.href}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 18px">
            <span style="font-size: 16px; flex: 1">{{r.label}}</span>
            <span style="font-size: 15px; color: #6B6B72">{{r.value}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3A3AA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (label, value, href) => ({ label, value, href: href || 'Settings.dc.html' });
    return {
      groups: [
        { title: '模型', rows: [r('DeepSeek 账号', '已连接'), r('默认模型', 'deepseek-v4'), r('访问模式', '询问后执行')] },
        { title: '扩展', rows: [r('插件', '9 个', 'Plugins.dc.html'), r('自动化', '2 个')] },
        { title: '通用', rows: [r('外观', '跟随系统'), r('存储', '1.8 GB'), r('引擎日志', '')] }
      ]
    };
  }
}
</script>
</body>
</html>
