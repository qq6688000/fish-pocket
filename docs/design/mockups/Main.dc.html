      <div style="display: flex; align-items: center; gap: 8px; margin-left: -6px">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"></path></svg>询问后执行</button>
        <span style="flex: 1"></span>
        <button aria-label="语音输入" style="all: unset; width: 38px; height: 38px; border-radius: 19px; background: #0C0C0D; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
