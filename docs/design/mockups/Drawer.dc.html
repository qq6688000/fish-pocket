<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧边栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0C0C0D}a:hover{color:#0C0C0D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0C0C0D; font-family: Inter, 'Noto Sans SC', system-ui, sans-serif; display: flex; overflow: hidden; position: relative">

  <nav aria-label="会话历史" style="width: 326px; flex: none; background: #FFFFFF; display: flex; flex-direction: column; padding: 58px 0 30px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px">
      <label for="find" style="position: absolute; left: -9999px">搜索会话</label>
      <span style="flex: 1; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 21px; background: #ECECEE">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B72" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="find" placeholder="搜索" style="all: unset; flex: 1; font-family: inherit; font-size: 15px; color: #0C0C0D">
      </span>
      <a href="Main.dc.html" aria-label="新会话" style="width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; padding: 14px 8px 0">
      <a href="Main.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: 12px; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
        <span style="flex: 1">dsh-ios</span>
        <span style="font-size: 13px; color: #6B6B72">切换</span>
      </a>
      <a href="Main.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: 12px; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="flex: 1">自动化</span>
        <span style="font-size: 13px; color: #6B6B72">2</span>
      </a>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 10px 8px 0; display: flex; flex-direction: column">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="font-size: 13px; color: #6B6B72; padding: 16px 12px 6px">{{g.title}}</div>
        <sc-for list="{{g.rows}}" as="s" hint-placeholder-count="3">
          <a href="{{s.href}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; background: {{s.bg}}">
            <span style="flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span>
            <sc-if value="{{s.hasDot}}" hint-placeholder-val="{{false}}">
              <span role="img" aria-label="{{s.dotLabel}}" style="width: 7px; height: 7px; border-radius: 4px; background: {{s.dot}}; flex: none"></span>
            </sc-if>
          </a>
        </sc-for>
      </sc-for>
    </div>

    <a href="Settings.dc.html" style="text-decoration: none; margin: 0 8px; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px; border-radius: 14px">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #E5E5E8; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 15px">设置</span>
        <span style="font-size: 12px; color: #6B6B72; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #12A06A"></span>引擎运行中</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3A3AA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
  </nav>

  <a href="Main.dc.html" aria-label="关闭侧边栏" style="flex: 1; background: #0C0C0D; opacity: 0.22"></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (title, href, dot, dotLabel, active) => ({ title, href: href || 'Conversation.dc.html', hasDot: !!dot, dot: dot || '', dotLabel: dotLabel || '', bg: active ? '#ECECEE' : 'transparent' });
    return {
      groups: [
        { title: '今天', rows: [
          row('清理构建产物', 'Approval.dc.html', '#D98A00', '等待允许'),
          row('把终端换成 just-bash 模拟层', 'Conversation.dc.html', '#12A06A', '运行中', true),
          row('插件兼容性排查'),
          row('修复 remote.mux 断流')
        ] },
        { title: '本周', rows: [
          row('整理 feasibility.md 进展'),
          row('Markdown 渲染支持表格'),
          row('宿主机跑通 node --test')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
